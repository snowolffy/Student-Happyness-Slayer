<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Online ผู้ใช้</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.btn{height:38px;padding:0 12px;border:1.5px solid #6b7079;border-radius:8px;font:inherit;font-size:13px;background:#fff;color:#1f2328;white-space:nowrap}
.btn-pri{background:#2b2f36;color:#fff;border-color:#2b2f36}
.btn-danger{border-color:#b42318;color:#b42318}
.card{display:flex;flex-direction:column;gap:8px;padding:12px;border:1.5px solid #8a8f98;border-radius:10px;background:#fff}
.badge{font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;border:1.5px solid #6b7079}
.new{outline:2px dashed #1d4ed8;outline-offset:2px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:#4b515b;text-decoration:none;flex:1;padding:6px 0;min-height:44px;justify-content:center}
.ico{width:22px;height:22px;border-radius:6px;background:#c9cdd3}
.tab-on{color:#1f2328;font-weight:700}
.tab-on .ico{background:#2b2f36}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #f6f7f9; font-family: 'IBM Plex Sans Thai', system-ui, sans-serif; color: #1f2328">
  <header style="padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; background: #fff; border-bottom: 1.5px solid #d5d8dd">
    <div style="display: flex; align-items: center; gap: 12px"><a href="oc-more.dc.html" style="font-size: 14px; color: #1f2328">← เมนู</a><strong style="font-size: 18px">ผู้ใช้ (ครู / Admin)</strong></div>
    <button class="btn btn-pri">+ เพิ่ม</button>
  </header>
  <div style="flex-grow: 1; overflow: hidden; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center"><strong style="font-size: 15px">{{r.u}}</strong><span class="badge new">{{r.role}}</span></div>
        <span style="font-size: 12px; color: #4b515b">ล็อกอินล่าสุด {{r.l}} · {{r.note}}</span>
        <div style="display: flex; gap: 8px"><button class="btn" style="flex: 1">รีเซ็ตรหัสผ่าน</button><button class="btn" style="flex: 1">เปลี่ยน Role</button><button class="btn btn-danger">ลบ</button></div>
      </div>
    </sc-for>
    <p style="margin: 0; font-size: 12px; color: #4b515b; line-height: 1.5">บัญชีนักเรียนไม่อยู่ที่นี่ จัดการใน Roster Manager บนคอม · ป้าย Role (เส้นประ) เป็นของใหม่</p>
  </div>
  <nav style="display: flex; border-top: 1.5px solid #d5d8dd; background: #fff; padding-bottom: 14px">
    <a href="oc-clients.dc.html" class="tab"><span class="ico"></span>Clients</a>
    <a href="oc-rules.dc.html" class="tab"><span class="ico"></span>Rules</a>
    <a href="oc-programs.dc.html" class="tab"><span class="ico"></span>Programs</a>
    <a href="oc-logs.dc.html" class="tab"><span class="ico"></span>Logs</a>
    <a href="oc-more.dc.html" class="tab tab-on"><span class="ico"></span>เมนู</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const rows = [
      { u: 'admin', role: 'Admin', l: 'วันนี้ 08:50', note: 'บัญชีระบบ' },
      { u: 'kru.[ชื่อ]', role: 'Teacher', l: 'เมื่อวาน', note: '—' },
      { u: 'kru.[ชื่อ]', role: 'Teacher', l: '—', note: 'ยังใช้รหัสเริ่มต้น' }
    ];
    return { rows };
  }
}
</script>
</body>
</html>
