<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Online Programs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.btn{height:40px;padding:0 12px;border:1.5px solid #6b7079;border-radius:8px;font:inherit;font-size:13px;background:#fff;color:#1f2328;white-space:nowrap;flex:1}
.btn-danger{border-color:#b42318;color:#b42318}
.pill{flex-shrink:0;padding:8px 12px;border:1.5px solid #6b7079;border-radius:999px;font:inherit;font-size:13px;background:#fff;color:#1f2328}
.pill-on{background:#2b2f36;color:#fff;border-color:#2b2f36}
.card{display:flex;flex-direction:column;gap:8px;padding:12px;border:1.5px solid #8a8f98;border-radius:10px;background:#fff}
.badge{font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;border:1.5px solid #6b7079}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:#4b515b;text-decoration:none;flex:1;padding:6px 0;min-height:44px;justify-content:center}
.tab-on{color:#1f2328;font-weight:700}
.ico{width:22px;height:22px;border-radius:6px;background:#c9cdd3}
.tab-on .ico{background:#2b2f36}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #f6f7f9; font-family: 'IBM Plex Sans Thai', system-ui, sans-serif; color: #1f2328">
  <header style="padding: 16px 16px 10px; display: flex; flex-direction: column; gap: 10px; background: #fff; border-bottom: 1.5px solid #d5d8dd">
    <h1 style="margin: 0; font-size: 22px; font-weight: 700">Program Review</h1>
    <div style="display: flex; gap: 6px; overflow: hidden"><button class="pill pill-on">รอตรวจ 6</button><button class="pill">บล็อกอยู่</button><button class="pill">อนุญาต</button><button class="pill">ทั้งหมด</button></div>
  </header>
  <div style="flex-grow: 1; overflow: hidden; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px">
          <div style="display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 15px">{{r.name}}</strong><span style="font-size: 12px; color: #4b515b">{{r.cat}} · พบ {{r.hits}} ครั้ง · ล่าสุด {{r.pc}}</span></div>
          <span class="badge">คะแนน {{r.score}}</span>
        </div>
        <span style="font-size: 12px; color: #2b2f36">{{r.why}}</span>
        <div style="display: flex; gap: 8px"><button class="btn">อนุญาตถาวร</button><button class="btn btn-danger">บล็อกถาวร</button></div>
      </div>
    </sc-for>
  </div>
  <nav style="display: flex; border-top: 1.5px solid #d5d8dd; background: #fff; padding-bottom: 14px">
    <a href="oc-clients.dc.html" class="tab"><span class="ico"></span>Clients</a>
    <a href="oc-rules.dc.html" class="tab"><span class="ico"></span>Rules</a>
    <a href="oc-programs.dc.html" class="tab tab-on"><span class="ico"></span>Programs</a>
    <a href="oc-logs.dc.html" class="tab"><span class="ico"></span>Logs</a>
    <a href="oc-more.dc.html" class="tab"><span class="ico"></span>เมนู</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const rows = [
      { name: 'yuzu.exe', cat: 'Emulator', hits: 7, pc: 'COM-14', score: 92, why: 'ชื่อตรงรายชื่อ emulator · ไม่มีลายเซ็น · รันจาก Downloads' },
      { name: 'MinecraftLauncher.exe', cat: 'เกม', hits: 12, pc: 'COM-02', score: 85, why: 'ผู้เผยแพร่อยู่ในหมวดเกม' },
      { name: 'TLauncher.exe', cat: 'เกม', hits: 4, pc: 'COM-21', score: 80, why: 'ชื่อตรงรายชื่อ launcher เกม' },
      { name: 'scratch.exe', cat: 'การศึกษา', hits: 30, pc: 'COM-05', score: 10, why: 'ผู้เผยแพร่ MIT · มีลายเซ็น' }
    ];
    return { rows };
  }
}
</script>
</body>
</html>
